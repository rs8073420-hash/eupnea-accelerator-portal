<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eupnea — Management Consulting & Startup Accelerator</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            syne: ['Syne', 'sans-serif'],
            dm: ['DM Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            eupnea: {
              blue: '#1E40AF',          /* Dignified Executive Oxford Navy */
              blueHover: '#1D4ED8',
              teal: '#0F766E',          /* Refined Slate Teal */
              navy: '#0F172A',          /* Deep Charcoal Navy for dark text/elements */
              surface: '#FFFFFF',       /* Crisp Pure White Surface */
              surface2: '#F8FAFC',      /* Soft Slate-50 Background */
              border: '#E2E8F0',        /* Crisp Subtle Border */
              borderSubtle: '#CBD5E1'
            }
          }
        }
      },
      plugins: [
        function({ addVariant }) {
          addVariant('light', 'html.light &');
        }
      ]
    }

    // ========================================================================
    // LINKEDIN ACCELERATOR RANKERS & INFLUENCER OUTREACH ENGINE (20 PER PAGE)
    // ========================================================================
    let cachedRankers = [];
    let filteredRankers = [];
    let rankersCurrentPage = 1;
    const rankersPerPage = 20;

    async function openAcceleratorRankersModal() {
      const modal = document.getElementById('modal-accelerator-rankers');
      if (modal) {
        modal.classList.remove('hidden');
        await loadAcceleratorRankers();
      }
    }

    function closeAcceleratorRankersModal() {
      const modal = document.getElementById('modal-accelerator-rankers');
      if (modal) modal.classList.add('hidden');
    }

    async function loadAcceleratorRankers() {
      const container = document.getElementById('rankers-cards-container');
      if (!container) return;
      try {
        const res = await fetch('/api/rankers');
        const data = await res.json();
        cachedRankers = Array.isArray(data) ? data : (data.rankers || []);
        filteredRankers = [...cachedRankers];
        rankersCurrentPage = 1;

        const badge = document.getElementById('rankers-count-badge');
        if (badge) badge.innerText = `${cachedRankers.length} Curators`;

        renderRankersPage();
      } catch (err) {
        console.error('Failed to load rankers:', err);
        container.innerHTML = `<div class="text-center py-10 text-rose-400 font-mono text-xs">Error loading rankers: ${err.message}</div>`;
      }
    }

    function filterRankers() {
      const q = (document.getElementById('rankers-search-input')?.value || '').toLowerCase().trim();
      const statusFilter = document.getElementById('rankers-status-filter')?.value || 'all';

      filteredRankers = cachedRankers.filter(r => {
        const name = (r.author_name || r.name || '').toLowerCase();
        const role = (r.headline || '').toLowerCase();
        const reach = (r.estimated_reach || '').toLowerCase();
        const topic = (r.ranking_title || '').toLowerCase();
        const status = (r.status || 'identified').toLowerCase();

        const matchesQuery = !q || name.includes(q) || role.includes(q) || reach.includes(q) || topic.includes(q);
        const matchesStatus = statusFilter === 'all' || status === statusFilter;
        return matchesQuery && matchesStatus;
      });

      rankersCurrentPage = 1;
      renderRankersPage();
    }

    function prevRankersPage() {
      if (rankersCurrentPage > 1) {
        rankersCurrentPage--;
        renderRankersPage();
      }
    }

    function nextRankersPage() {
      const totalPages = Math.ceil(filteredRankers.length / rankersPerPage) || 1;
      if (rankersCurrentPage < totalPages) {
        rankersCurrentPage++;
        renderRankersPage();
      }
    }

    function goToRankersPage(p) {
      rankersCurrentPage = p;
      renderRankersPage();
    }

    function renderRankersPage() {
      const container = document.getElementById('rankers-cards-container');
      if (!container) return;

      const totalItems = filteredRankers.length;
      const totalPages = Math.ceil(totalItems / rankersPerPage) || 1;
      if (rankersCurrentPage > totalPages) rankersCurrentPage = totalPages;
      if (rankersCurrentPage < 1) rankersCurrentPage = 1;

      const startIdx = (rankersCurrentPage - 1) * rankersPerPage;
      const endIdx = Math.min(startIdx + rankersPerPage, totalItems);
      const pageItems = filteredRankers.slice(startIdx, endIdx);

      // Update Pagination Indicators
      const pageInd = document.getElementById('rankers-page-indicator');
      if (pageInd) pageInd.innerText = `Page ${rankersCurrentPage} / ${totalPages}`;

      const showingText = document.getElementById('rankers-showing-text');
      if (showingText) {
        showingText.innerText = totalItems === 0 
          ? 'No rankers matched filter' 
          : `Showing ${startIdx + 1}–${endIdx} of ${totalItems} rankers (${rankersPerPage} per page)`;
      }

      const prevBtn = document.getElementById('btn-rankers-prev');
      if (prevBtn) prevBtn.disabled = (rankersCurrentPage <= 1);
      const nextBtn = document.getElementById('btn-rankers-next');
      if (nextBtn) nextBtn.disabled = (rankersCurrentPage >= totalPages);

      // Render Pagination Number Buttons
      const pagBtnsContainer = document.getElementById('rankers-pagination-buttons');
      if (pagBtnsContainer) {
        let pagHtml = `<button onclick="prevRankersPage()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-30 text-xs font-mono" ${rankersCurrentPage <= 1 ? 'disabled' : ''}>← Prev</button>`;
        for (let p = 1; p <= totalPages; p++) {
          const isActive = (p === rankersCurrentPage);
          pagHtml += `<button onclick="goToRankersPage(${p})" class="px-2.5 py-1 rounded-lg text-xs font-mono font-bold transition-all ${isActive ? 'bg-pink-600 text-white shadow-md shadow-pink-600/30' : 'bg-slate-800/80 hover:bg-slate-700 text-slate-300'}">${p}</button>`;
        }
        pagHtml += `<button onclick="nextRankersPage()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-30 text-xs font-mono" ${rankersCurrentPage >= totalPages ? 'disabled' : ''}>Next →</button>`;
        pagBtnsContainer.innerHTML = pagHtml;
      }

      if (pageItems.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-400 font-mono text-xs border border-dashed border-slate-800 rounded-xl bg-slate-950/40">
            <span class="text-2xl block mb-2">🔍</span>
            <span>No curators matched your query. Try clearing the search or status filter.</span>
          </div>`;
        return;
      }

      container.innerHTML = pageItems.map((r, i) => {
        const itemNum = startIdx + i + 1;
        const rankerName = r.author_name || r.name || 'Venture Curator';
        const rankerRole = r.headline || 'UK Accelerator Analyst';
        const reach = r.estimated_reach || '30,000+ Reach';
        const status = r.status || 'identified';
        const angle = r.ranking_title || 'Top UK Accelerator Curations';
        const pitch = r.pitch_draft || '';
        const profUrl = r.profile_url || '';
        const searchKeywords = encodeURIComponent(`${rankerName} venture accelerator LinkedIn`);
        const searchFallbackUrl = `https://www.linkedin.com/search/results/all/?keywords=${searchKeywords}`;

        let statusClass = 'bg-slate-800 text-slate-300 border-slate-700';
        if (status === 'contacted') statusClass = 'bg-sky-500/20 text-sky-300 border-sky-500/40 font-bold';
        if (status === 'pitch_sent') statusClass = 'bg-purple-500/25 text-purple-300 border-purple-500/50 font-bold';
        if (status === 'listed') statusClass = 'bg-emerald-500/25 text-emerald-300 border-emerald-500/50 font-bold';

        return `
        <div class="p-4 rounded-xl bg-slate-900/90 border border-slate-800 hover:border-pink-500/40 transition-all flex flex-col md:flex-row md:items-center justify-between gap-4">
          
          <!-- Column 1: Number, Avatar & Identity -->
          <div class="flex items-start gap-3 md:w-5/12">
            <span class="w-6 h-6 rounded-lg bg-slate-800 text-slate-400 font-mono text-[11px] font-bold flex items-center justify-center shrink-0 mt-0.5">${itemNum}</span>
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <h4 class="font-syne font-bold text-sm text-white flex items-center gap-1.5">
                  <span>${escapeHtml(rankerName)}</span>
                  <span class="text-sky-400 text-xs" title="Verified UK Venture Ecosystem Leader">✓</span>
                </h4>
                <span class="text-[10px] font-mono px-2 py-0.5 rounded font-bold" style="background: rgba(236,72,153,0.18); color: #f472b6; border: 1px solid rgba(236,72,153,0.4);">${escapeHtml(reach)}</span>
              </div>
              <div class="text-[11px] font-mono text-slate-300 mt-0.5 leading-snug truncate" title="${escapeHtml(rankerRole)}">${escapeHtml(rankerRole)}</div>
              
              <!-- Topic / Angle -->
              <div class="text-[11px] text-slate-400 mt-1 leading-snug">
                <span class="text-pink-400 font-semibold font-mono text-[10px] uppercase tracking-wider">Ranking Angle:</span> 
                <span class="text-slate-300">${escapeHtml(angle)}</span>
              </div>
            </div>
          </div>

          <!-- Column 2: Direct Verified Links & Status Action -->
          <div class="flex flex-col gap-2 md:w-3/12 shrink-0">
            <div class="flex items-center gap-2 flex-wrap">
              ${profUrl ? `
                <a href="${escapeHtml(profUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-blue-600/20 hover:bg-blue-600/35 text-blue-300 border border-blue-500/40 text-[11px] font-mono font-semibold transition-all">
                  <span>Open Profile ↗</span>
                </a>
              ` : ''}
              <a href="${searchFallbackUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] font-mono transition-all" title="Verified live search on LinkedIn to prevent authwall 404">
                <span>🔍 Verify</span>
              </a>
            </div>

            <!-- Status Dropdown -->
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-mono px-2 py-0.5 rounded border uppercase ${statusClass}">${escapeHtml(status)}</span>
              <select onchange="updateRankerStatus(${r.id}, this.value)" class="bg-slate-950 border border-slate-700 text-[10px] font-mono text-slate-200 rounded px-2 py-1 cursor-pointer outline-none">
                <option value="identified" ${status === 'identified' ? 'selected' : ''}>Identified</option>
                <option value="contacted" ${status === 'contacted' ? 'selected' : ''}>Contacted</option>
                <option value="pitch_sent" ${status === 'pitch_sent' ? 'selected' : ''}>Pitch Sent</option>
                <option value="listed" ${status === 'listed' ? 'selected' : ''}>Listed in Top X</option>
              </select>
            </div>
          </div>

          <!-- Column 3: Pitch Snippet & Copy Action -->
          <div class="md:w-4/12 flex flex-col justify-between p-2.5 rounded-lg bg-slate-950/80 border border-slate-800 text-[11px] font-mono">
            <div class="flex items-center justify-between mb-1 text-[10px] text-slate-400 font-bold uppercase">
              <span>Bespoke Pitch:</span>
              <button onclick="copyRankerPitch(${r.id})" class="text-pink-400 hover:text-pink-300 font-bold flex items-center gap-1 cursor-pointer">
                <span id="copy-ranker-btn-${r.id}">📋 Copy Pitch</span>
              </button>
            </div>
            <div class="text-[10px] text-slate-300 line-clamp-3 leading-relaxed" id="ranker-pitch-text-${r.id}">${escapeHtml(pitch)}</div>
          </div>

        </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }

    async function updateRankerStatus(rankerId, status) {
      try {
        const res = await fetch(`/api/rankers/${rankerId}/status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: status })
        });
        const result = await res.json();
        if (result.success) {
          showNotification(`Updated ${result.name} status to '${status}'`, 'success');
          // Update cached
          const found = cachedRankers.find(x => x.id === rankerId);
          if (found) found.status = status;
          renderRankersPage();
        } else {
          showNotification(`Update failed: ${result.error}`, 'error');
        }
      } catch (err) {
        showNotification(`Error: ${err.message}`, 'error');
      }
    }

    function copyRankerPitch(rankerId) {
      const pitchEl = document.getElementById(`ranker-pitch-text-${rankerId}`);
      const btnEl = document.getElementById(`copy-ranker-btn-${rankerId}`);
      if (!pitchEl) return;
      const text = pitchEl.innerText || pitchEl.textContent;
      navigator.clipboard.writeText(text).then(() => {
        if (btnEl) btnEl.innerText = '✓ Copied!';
        setTimeout(() => {
          if (btnEl) btnEl.innerText = '📋 Copy Pitch';
        }, 2000);
        showNotification('Pitch copied to clipboard!', 'success');
      }).catch(err => {
        showNotification('Failed to copy pitch: ' + err.message, 'error');
      });
    }

    async function triggerAstraR01Hunter() {
      const btn = document.getElementById('btn-run-astra-r01');
      const statusMsg = document.getElementById('astra-r01-status-msg');
      if (btn) btn.disabled = true;
      if (statusMsg) statusMsg.innerText = 'Astra-R01 Hunting verified UK curators...';

      try {
        const res = await fetch('/api/category-agents/astra_r01/run', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showNotification(data.message || 'Astra-R01 discovery cycle finished!', 'success');
          if (statusMsg) statusMsg.innerText = `Active · Discovered: ${data.total_rankers} curators`;
          await loadAcceleratorRankers();
        } else {
          showNotification('Astra-R01 run error: ' + (data.error || 'Failed'), 'error');
          if (statusMsg) statusMsg.innerText = 'Status: Standby / Ready to Hunt';
        }
      } catch (err) {
        showNotification('Agent error: ' + err.message, 'error');
        if (statusMsg) statusMsg.innerText = 'Status: Standby / Ready to Hunt';
      } finally {
        if (btn) btn.disabled = false;
      }
    }
      if (statusMsg) {
        statusMsg.innerHTML = `<span class="text-amber-400">⚡ Astra-R01 is crawling LinkedIn accelerator carousels & rankings...</span>`;
      }

      try {
        const res = await fetch('/api/category-agents/astra_r01/run?batch_size=2', { method: 'POST' });
        const data = await res.json();
        
        if (data.success) {
          showToast(`⚡ Astra-R01: ${data.message}`);
          if (statusMsg) {
            statusMsg.innerHTML = `<span class="text-emerald-400 font-bold">✅ Success: Discovered ${data.count_added} curators (Total: ${data.total_rankers})</span>`;
          }
          await loadAcceleratorRankers();
          if (typeof loadDashboardStats === 'function') loadDashboardStats();
        } else {
          showToast(`Astra-R01 Report: ${data.message || 'Execution completed'}`);
        }
      } catch (err) {
        console.error('Failed to run Astra-R01:', err);
        showToast('Error executing Astra-R01 agent.');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span class="w-2 h-2 rounded-full bg-white animate-ping"></span> <span>⚡ Run Astra-R01 (AI Ranker Hunter)</span>`;
        }
      }
    }

    async function openCategoryFleetModal() {
      const modal = document.getElementById('modal-category-fleet');
      if (modal) {
        modal.classList.remove('hidden');
        await loadCategoryFleet();
      }
    }

    function closeCategoryFleetModal() {
      const modal = document.getElementById('modal-category-fleet');
      if (modal) modal.classList.add('hidden');
    }

    async function loadCategoryFleet() {
      const container = document.getElementById('category-fleet-cards-container');
      if (!container) return;

      try {
        const res = await fetch('/api/category-agents');
        const data = await res.json();
        cachedCategoryAgents = Array.isArray(data) ? data : [];

        if (cachedCategoryAgents.length === 0) {
          container.innerHTML = `<div class="col-span-2 text-center py-6 text-slate-400 font-mono text-xs">No category agents found.</div>`;
          return;
        }

        container.innerHTML = cachedCategoryAgents.map(ag => {
          const queries = ag.search_query_patterns || [];
          const queryChips = queries.slice(0, 2).map(q => 
            `<span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-300 truncate max-w-[200px]" title="${escapeHtml(q)}">${escapeHtml(q)}</span>`
          ).join('');

          let badgeColor = 'text-indigo-300 border-indigo-500/40 bg-indigo-500/10';
          if (ag.id === 'astra_r01') badgeColor = 'text-pink-300 border-pink-500/40 bg-pink-500/15 font-bold';
          if (ag.id === 'astra_s01') badgeColor = 'text-purple-300 border-purple-500/40 bg-purple-500/15';
          if (ag.id === 'astra_u01') badgeColor = 'text-sky-300 border-sky-500/40 bg-sky-500/15';

          return `
          <div class="p-4 rounded-xl border border-slate-800 hover:border-slate-700 transition-all flex flex-col justify-between" style="background:#090d16;">
            <div>
              <div class="flex items-start justify-between gap-2 mb-2">
                <div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="px-2 py-0.5 rounded text-[10px] font-mono border ${badgeColor}">${escapeHtml(ag.agent_code)}</span>
                    <h4 class="font-syne font-bold text-sm text-white">${escapeHtml(ag.name)}</h4>
                  </div>
                  <div class="text-[11px] font-mono text-slate-400 mt-1">
                    Category: <span class="text-indigo-400 font-bold">${escapeHtml(ag.category_name)}</span>
                  </div>
                </div>

                <div class="text-right">
                  <div class="text-xs font-mono font-bold text-white px-2 py-1 rounded bg-slate-900 border border-slate-700">
                    <span class="text-emerald-400">${ag.items_discovered || 0}</span> Discovered
                  </div>
                </div>
              </div>

              <p class="text-[11px] text-slate-300 leading-relaxed mb-3">
                ${escapeHtml(ag.specialization)}
              </p>

              <!-- Query Chips -->
              <div class="flex items-center gap-1.5 mb-3 flex-wrap">
                <span class="text-[9px] font-mono text-slate-500">QUERIES:</span>
                ${queryChips}
              </div>
            </div>

            <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between gap-2">
              <span class="text-[10px] font-mono text-slate-400">
                ${ag.last_run ? `Last run: ${ag.last_run.split(' ')[1] || ag.last_run}` : 'Ready to execute'}
              </span>

              <button onclick="runCategoryAgent('${ag.id}', this)" id="btn-agent-${ag.id}" class="px-3 py-1 rounded-lg bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 border border-indigo-500/50 text-xs font-mono font-bold flex items-center gap-1 transition-all cursor-pointer">
                <span>⚡ Run Agent</span>
              </button>
            </div>
          </div>
          `;
        }).join('');

        if (window.lucide) window.lucide.createIcons();
      } catch (err) {
        console.error('Failed to load category fleet:', err);
      }
    }

    async function runCategoryAgent(agentId, btnEl) {
      if (btnEl) {
        btnEl.disabled = true;
        btnEl.innerHTML = `<span class="w-2.5 h-2.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;
      }
      try {
        const res = await fetch(`/api/category-agents/${agentId}/run?batch_size=3`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showToast(`⚡ ${data.agent_code}: ${data.message}`);
          await loadCategoryFleet();
          if (typeof loadDashboardStats === 'function') loadDashboardStats();
          if (typeof loadReviewQueue === 'function') loadReviewQueue();
          if (typeof loadPresencePlatforms === 'function') loadPresencePlatforms();
          if (agentId === 'astra_r01') await loadAcceleratorRankers();
        } else {
          showToast(data.message || 'Execution completed');
        }
      } catch (err) {
        console.error(`Error running agent ${agentId}:`, err);
        showToast('Error executing category agent.');
      } finally {
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.innerHTML = `<span>⚡ Run Agent</span>`;
        }
      }
    }

    async function runAllCategoryAgents() {
      const btn = document.getElementById('btn-run-all-cat-agents');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span> <span>Executing 7 Category Hunters...</span>`;
      }
      try {
        const res = await fetch('/api/category-agents/run-all', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showToast(`🚀 Successfully triggered all ${data.executed_agents} category agents!`);
          await loadCategoryFleet();
          await loadAcceleratorRankers();
          if (typeof loadDashboardStats === 'function') loadDashboardStats();
        }
      } catch (err) {
        console.error('Error running all category agents:', err);
        showToast('Failed to execute all category agents.');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="zap" class="w-3.5 h-3.5"></i> <span>⚡ Execute All 7 Category Agents Concurrently</span>`;
          if (window.lucide) window.lucide.createIcons();
        }
      }
    }

</script>
</body>
</html>
